<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buggy Online Shop - Team 4</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { display: flex; gap: 20px; }
        .products, .cart { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .products { flex: 2; }
        .cart { flex: 1; min-width: 300px; }
        .product-item { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; }
        button { cursor: pointer; background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; }
        button.delete { background: #dc3545; }
        .total { font-weight: bold; font-size: 1.2em; margin-top: 20px; color: #333; }
        /* БАГ: UI ломается при определенных условиях (отсутствие адаптивности для длинных имен) */
        .broken-ui { white-space: nowrap; overflow: visible; width: 50px; } 
    </style>
</head>
<body>

    <h1>Online Shop (Debug Edition) — Команда 4</h1>
    
    <div class="container">
        <div class="products">
            <h2>Товары</h2>
            <div id="product-list">
                <div class="product-item">
                    <span>Ноутбук (50000 руб)</span>
                    <button onclick="addToCart(1)">Добавить</button>
                </div>
                <div class="product-item">
                    <span>Мышь (1500 руб)</span>
                    <button onclick="addToCart(2)">Добавить</button>
                </div>
                <div class="product-item">
                    <span>Клавиатура (3000 руб)</span>
                    <button onclick="addToCart(3)">Добавить</button>
                </div>
            </div>
        </div>

        <div class="cart">
            <h2>Корзина</h2>
            <ul id="cart-items">
                </ul>
            <div class="total">
                Итого: <span id="total-price">0</span> руб.
            </div>
            <br>
            <button onclick="checkout()" style="background: #007bff;">Оформить заказ</button>
        </div>
    </div>

    <script>
        // Исходные данные
        const products = [
            { id: 1, name: "Ноутбук", price: 50000 },
            { id: 2, name: "Мышь", price: 1500 },
            { id: 3, name: "Клавиатура", price: 3000 }
        ];

        let cart = [];

        // ШАГ 2: ВНЕДРЕНИЕ БАГОВ

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            
            // БАГ: Дублирование товаров (всегда пушим новый объект вместо изменения quantity)
            // БАГ: Неверное количество (всегда записываем фиксированное или странное значение)
            cart.push({ ...product, quantity: 1 });
            
            renderCart();
        }

        function removeItem(productId) {
            console.log("Попытка удаления id:", productId);
            // БАГ: Товар не удаляется (метод filter создает новый массив, но мы не перезаписываем переменную cart)
            cart.filter(item => item.id !== productId); 
            
            renderCart();
        }

        function calculateTotal() {
            if (cart.length === 0) {
                // БАГ: Ошибка при пустой корзине (возвращаем null, что вызовет ошибку при попытке сложения)
                return null; 
            }

            let total = cart.reduce((sum, item) => sum + item.price, 0);
            
            // БАГ: Неверная сумма заказа (конкатенация строки вместо математического сложения)
            return total + "0"; 
        }

        function renderCart() {
            const list = document.getElementById('cart-items');
            
            // БАГ: UI ломается (если список очень большой, мы не очищаем некоторые элементы)
            list.innerHTML = '';
            
            cart.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'product-item';
                li.innerHTML = `
                    <span class="broken-ui">${item.name}</span> 
                    <span>${item.price} руб.</span>
                    <button class="delete" onclick="removeItem(${item.id})">Удалить</button>
                `;
                list.appendChild(li);
            });

            // БАГ: Нет обработки ошибок (если calculateTotal вернет null, всё сломается)
            document.getElementById('total-price').innerText = calculateTotal();
        }

        function checkout() {
            // БАГ: Ошибка при обновлении страницы (данные не сохраняются в localStorage, 
            // хотя пользователь ожидает сохранения состояния заказа)
            alert("Заказ оформлен! (Но корзина обнулится при обновлении)");
        }

        // БАГ: Ошибка при обновлении страницы / Нет обработки исключений
        // Имитируем падение скрипта при странных условиях
        window.onload = () => {
            console.log("Приложение запущено. Ошибки готовы к поиску.");
        };

    </script>
</body>
</html>
