<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Task Manager</title>

<style>
body {
  font-family: Arial;
  margin: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
}

input {
  width: 65%;
  padding: 8px;
}

button {
  padding: 8px;
  margin-left: 5px;
}

li {
  margin: 10px 0;
  list-style: none;
  border: 1px solid #ccc;
  padding: 5px;
}

/* адаптив */
@media (max-width: 400px) {
  .container {
    width: 900px; /* специально */
  }
}
</style>
</head>

<body>

<div class="container">
  <h2>Task Manager</h2>

  <input type="text" id="taskInput" placeholder="Введите задачу">
  <button onclick="addTask()">Добавить</button>

  <br><br>

  <input type="text" id="searchInput" placeholder="Поиск" onkeyup="render()">

  <ul id="taskList"></ul>
</div>

<script>
let tasks = [];

function addTask() {
  // БАГ №1: Нет проверки на пустой ввод
  let input = document.getElementById("taskInput").value;
  
  // БАГ №2: Не сохраняется состояние задачи при добавлении
  tasks.push({
    text: input,
    // done не добавляется - будет undefined
  });

  // БАГ №3: Не очищается поле ввода после добавления
  render();
}

function render() {
  let list = document.getElementById("taskList");
  let query = document.getElementById("searchInput").value;

  list.innerHTML = "";

  // БАГ №4: Неправильная обработка поиска (регистрозависимый)
  tasks.forEach((task, index) => {
    // БАГ №5: Ошибка при поиске - задача не покажется если query частично совпадает
    if (query && task.text !== query) {
      return;
    }

    let li = document.createElement("li");

    // БАГ №6: Обрезает текст даже если он короче 25 символов
    let text = task.text.substring(0, 25);

    li.innerHTML = `
      <span onclick="toggleTask(${index})"
        style="text-decoration: ${task.done ? 'line-through' : 'none'}">
        ${text}
      </span>

      <button onclick="deleteTask(${index})">Удалить</button>
    `;

    list.appendChild(li);
  });
}

function deleteTask(index) {
  // БАГ №7: Удаляет не тот элемент (смещение на +1)
  tasks.splice(index + 1, 1);
  render();
}

function toggleTask(index) {
  // БАГ №8: Нет проверки существования задачи
  tasks[index].done = !tasks[index].done;
  render();
}

// БАГ №9 (дополнительный): Нет инициализации при загрузке
// render() не вызывается при загрузке страницы
</script>

</body>
</html>
